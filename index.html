<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Retro Chat – John</title>
    <style>
        :root {
            --bg: #0a0a0a; --grid: #1f1f1f; --text: #b0b0b0; --accent: #f0a500;
            --player: #4ecdc4; --npc: #f0a500;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #050505;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            touch-action: manipulation;
        }
        .game-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            width: 100%; max-width: 800px; padding: 10px;
        }
        canvas {
            border: 2px solid #333; border-radius: 0; background: #0a0a0a;
            width: 100%; height: auto; aspect-ratio: 800 / 450; display: block;
            image-rendering: pixelated;
        }
        .mobile-controls {
            display: none; width: 100%; justify-content: space-between;
            align-items: center; gap: 10px; margin-top: 5px;
        }
        .dpad { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .dpad-row { display: flex; gap: 4px; }
        .ctrl-btn {
            width: 45px; height: 45px; background: #1a1a1a; border: 2px solid #444;
            color: #ccc; font-size: 18px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-tap-highlight-color: transparent; border-radius: 4px;
        }
        .ctrl-btn:active { background: #333; border-color: var(--accent); color: var(--accent); }
        .interact-btn {
            width: 100px; height: 45px; background: #1a1a1a; border: 2px solid var(--accent);
            color: var(--accent); font-size: 14px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; border-radius: 4px;
        }
        .chat-panel {
            background: #0f0f0f; border: 2px solid #333; padding: 10px; color: var(--text);
            width: 100%; display: flex; flex-direction: column; gap: 6px;
            font-family: 'Courier New', monospace;
        }
        .chat-history {
            height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
            font-size: 13px; line-height: 1.3;
        }
        .chat-message {
            padding: 4px 8px; border-radius: 0; max-width: 80%; word-break: break-word;
            border: 1px solid #333;
        }
        .chat-message.player { align-self: flex-end; background: #1a2a1a; color: #b0ffb0; border-color: #2a4a2a; }
        .chat-message.npc { align-self: flex-start; background: #1a1a2a; color: #ffd0a0; border-color: #4a3a2a; }
        .input-area { display: flex; gap: 6px; }
        .input-area input {
            flex: 1; background: #0a0a0a; border: 1px solid #444; padding: 8px; color: #ccc;
            font-family: 'Courier New', monospace; font-size: 13px; outline: none;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .input-area input:disabled { opacity: 0.4; pointer-events: none; }
        .input-area input:focus { border-color: var(--accent); }
        .input-area button {
            background: #1a1a1a; border: 1px solid var(--accent); color: var(--accent);
            padding: 8px 14px; font-weight: bold; cursor: pointer;
            font-family: 'Courier New', monospace; text-transform: uppercase; transition: opacity 0.2s;
        }
        .input-area button:disabled { opacity: 0.4; pointer-events: none; }
        .warning { color: #ff5555; font-size: 11px; text-align: center; display: none; }
        .hint { color: #666; font-size: 11px; text-align: center; font-family: 'Courier New', monospace; }
        @media (max-width: 600px) {
            .mobile-controls { display: flex; }
            .hint.desktop-only { display: none; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="warning" id="warningBox">🔑 AI unavailable. Chatting locally.</div>
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="mobile-controls" id="mobileControls">
            <div class="dpad">
                <div class="dpad-row"><div class="ctrl-btn" data-key="ArrowUp">↑</div></div>
                <div class="dpad-row">
                    <div class="ctrl-btn" data-key="ArrowLeft">←</div>
                    <div class="ctrl-btn" data-key="ArrowDown">↓</div>
                    <div class="ctrl-btn" data-key="ArrowRight">→</div>
                </div>
            </div>
            <button class="interact-btn" id="interactBtn">Interact</button>
        </div>
        <div class="chat-panel">
            <div class="chat-history" id="chatHistory">
                <div class="chat-message npc">Hey. I'm John. Come over if you wanna chat.</div>
            </div>
            <div class="input-area">
                <input type="text" id="playerInput" placeholder="Press E near John to chat..." disabled />
                <button id="sendBtn" disabled>Send</button>
            </div>
        </div>
        <div class="hint desktop-only">WASD / Arrows to move • Stand near John and press <b>E</b> to chat</div>
    </div>

    <script>
        (function() {
            // ⚠️ YOUR HUGGING FACE TOKEN – replace with your real token
            // Keep this repo private if you don't want to expose it!
            const HF_TOKEN = "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";
            const HF_MODEL = "HuggingFaceH4/zephyr-7b-beta";
            const HF_API_URL = `https://api-inference.huggingface.co/models/${HF_MODEL}/v1/chat/completions`;

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const chatHistory = document.getElementById('chatHistory');
            const playerInput = document.getElementById('playerInput');
            const sendBtn = document.getElementById('sendBtn');
            const warningBox = document.getElementById('warningBox');
            const interactBtn = document.getElementById('interactBtn');

            const W = 800, H = 450;
            const SIZE = 20;

            const player = { x: 120, y: 250, size: SIZE, speed: 180, color: '#4ecdc4' };
            const npc = {
                x: 650, y: 200, size: SIZE, color: '#f0a500',
                name: 'John',
                speed: 40,
                angle: 0,
                wanderTimer: 0
            };

            const keys = {};
            let chatOpen = false;
            let lastTime = performance.now();
            const mobileKeys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

            let messages = [
                { role: "system", content: "You are John, a very casual, laid-back guy. Speak in short, simple sentences like texting a friend. Use lowercase, no emojis, no markdown." }
            ];

            const localMemory = { userName: null };
            function localReply(msg) {
                const m = msg.toLowerCase().trim();
                if (/^(hi|hey|hello|yo|sup|what's up|howdy)/i.test(m)) {
                    return localMemory.userName ? `hey ${localMemory.userName}. what's up?` : "hey. what's up?";
                }
                const nameMatch = m.match(/(?:i'm|i am|my name is|call me|i'm called)\s+(\w+)/i);
                if (nameMatch) {
                    localMemory.userName = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1).toLowerCase();
                    return `nice to meet you, ${localMemory.userName}. i'm john.`;
                }
                if (/(what's your name|who are you|your name)/i.test(m)) return "i'm john. just john. what about you?";
                if (/(how are you|how's it going|how are things)/i.test(m)) {
                    const resp = ["pretty good, thanks. you?", "same old. just wandering around.", "not bad. a bit bored maybe."];
                    return resp[Math.floor(Math.random() * resp.length)];
                }
                if (/(good|fine|okay|alright|not bad|meh|tired|bored)/i.test(m) && m.length < 15) {
                    if (m.includes('tired')) return "yeah me too. long day.";
                    if (m.includes('bored')) return "same here. this place is dead.";
                    return "that's cool.";
                }
                if (/(what are you doing|what do you do|what's your job)/i.test(m)) return "just chilling. not much to do around here. you?";
                if (/(where are we|what is this place)/i.test(m)) return "no idea. some kind of retro game world, i guess.";
                if (/(bye|see ya|later)/i.test(m)) return localMemory.userName ? `later, ${localMemory.userName}.` : "later.";
                const defaults = ["interesting. tell me more.", "huh. never thought of that.", "i guess so.", "you really think so?"];
                return defaults[Math.floor(Math.random() * defaults.length)];
            }

            async function aiReply(userMsg) {
                // If token is clearly invalid (placeholder), use local
                if (!HF_TOKEN || HF_TOKEN === "YOUR_TOKEN_HERE" || HF_TOKEN.length < 10) {
                    showWarning("🔑 Token missing or invalid. Using local chat.");
                    return localReply(userMsg);
                }

                messages.push({ role: "user", content: userMsg });

                try {
                    const response = await fetch(HF_API_URL, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${HF_TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: HF_MODEL,
                            messages: messages,
                            max_tokens: 60,
                            temperature: 0.9
                        })
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        console.error("HF error:", response.status, errText);
                        showWarning(`❌ HF error ${response.status}. Using local chat.`);
                        messages.pop();
                        return localReply(userMsg);
                    }

                    const data = await response.json();

                    if (data.error) {
                        console.error("HF error:", data.error);
                        if (typeof data.error === 'string' && data.error.includes("loading")) {
                            showWarning("⏳ Model loading. Try again in a moment.");
                            messages.pop();
                            return "model's waking up, hold on.";
                        }
                        showWarning("❌ " + (typeof data.error === 'string' ? data.error : JSON.stringify(data.error)));
                        messages.pop();
                        return localReply(userMsg);
                    }

                    const replyText = data.choices[0].message.content;
                    messages.push({ role: "assistant", content: replyText });

                    if (messages.length > 21) {
                        messages = [messages[0], ...messages.slice(-20)];
                    }

                    warningBox.style.display = 'none';
                    return replyText;

                } catch (err) {
                    console.error("Fetch failed:", err);
                    showWarning("🌐 Network error. Using local chat.");
                    messages.pop();
                    return localReply(userMsg);
                }
            }

            function showWarning(msg) {
                warningBox.textContent = msg;
                warningBox.style.display = 'block';
            }

            function isPlayerNearNpc() {
                const dx = player.x - npc.x;
                const dy = player.y - npc.y;
                return Math.sqrt(dx*dx + dy*dy) < 60;
            }

            function update(dt) {
                if (!chatOpen) {
                    let dx = 0, dy = 0;
                    if (keys.ArrowUp || keys.KeyW || mobileKeys.ArrowUp) dy--;
                    if (keys.ArrowDown || keys.KeyS || mobileKeys.ArrowDown) dy++;
                    if (keys.ArrowLeft || keys.KeyA || mobileKeys.ArrowLeft) dx--;
                    if (keys.ArrowRight || keys.KeyD || mobileKeys.ArrowRight) dx++;
                    if (dx !== 0 || dy !== 0) {
                        const len = Math.sqrt(dx*dx + dy*dy);
                        player.x += (dx/len) * player.speed * dt;
                        player.y += (dy/len) * player.speed * dt;
                        player.x = Math.max(SIZE/2, Math.min(W - SIZE/2, player.x));
                        player.y = Math.max(SIZE/2, Math.min(H - SIZE/2, player.y));
                    }
                }
                if (!chatOpen) {
                    npc.wanderTimer -= dt;
                    if (npc.wanderTimer <= 0) {
                        npc.angle = Math.random() * Math.PI * 2;
                        npc.wanderTimer = 1.5 + Math.random() * 2;
                    }
                    npc.x += Math.cos(npc.angle) * npc.speed * dt;
                    npc.y += Math.sin(npc.angle) * npc.speed * dt;
                    npc.x = Math.max(60, Math.min(W - 60, npc.x));
                    npc.y = Math.max(60, Math.min(H - 60, npc.y));
                    if (npc.x <= 60 || npc.x >= W - 60 || npc.y <= 60 || npc.y >= H - 60) {
                        npc.angle = Math.random() * Math.PI * 2;
                    }
                }
            }

            function draw() {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = '#1f1f1f';
                ctx.lineWidth = 1;
                for (let i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
                for (let j = 0; j < H; j += 40) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(W,j); ctx.stroke(); }
                ctx.strokeStyle = npc.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(npc.x - npc.size/2, npc.y - npc.size/2, npc.size, npc.size);
                ctx.strokeRect(npc.x - npc.size/2, npc.y - npc.size/2, npc.size, npc.size);
                ctx.fillStyle = npc.color;
                ctx.font = '12px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText(npc.name, npc.x, npc.y - npc.size/2 - 6);
                if (isPlayerNearNpc() && !chatOpen) {
                    ctx.fillStyle = '#f0a500';
                    ctx.font = '11px "Courier New"';
                    ctx.fillText('[E] Talk', npc.x, npc.y + npc.size/2 + 14);
                }
                ctx.strokeStyle = player.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
                ctx.strokeRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
                ctx.fillStyle = player.color;
                ctx.fillText('You', player.x, player.y - player.size/2 - 6);
            }

            function loop(now) {
                const dt = Math.min(0.05, (now - lastTime) / 1000);
                lastTime = now;
                update(dt);
                draw();
                requestAnimationFrame(loop);
            }

            function addMsg(text, who) {
                const div = document.createElement('div');
                div.className = `chat-message ${who}`;
                div.textContent = text;
                chatHistory.appendChild(div);
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }

            async function handleSend() {
                if (!chatOpen) return;
                const msg = playerInput.value.trim();
                if (!msg) return;
                addMsg(msg, 'player');
                playerInput.value = '';
                sendBtn.disabled = true;
                playerInput.disabled = true;
                const reply = await aiReply(msg);
                addMsg(reply, 'npc');
                if (chatOpen) {
                    sendBtn.disabled = false;
                    playerInput.disabled = false;
                    playerInput.focus();
                }
            }

            function tryOpenChat() {
                if (chatOpen) return;
                if (isPlayerNearNpc()) {
                    chatOpen = true;
                    playerInput.disabled = false;
                    sendBtn.disabled = false;
                    playerInput.placeholder = "Type a message...";
                    playerInput.focus();
                }
            }

            function closeChat() {
                chatOpen = false;
                playerInput.disabled = true;
                sendBtn.disabled = true;
                playerInput.placeholder = "Press E near John to chat...";
                playerInput.blur();
            }

            window.addEventListener('keydown', e => {
                if (e.code === 'KeyE' && !chatOpen) {
                    tryOpenChat();
                    e.preventDefault();
                    return;
                }
                if (e.code === 'Escape') {
                    closeChat();
                    e.preventDefault();
                    return;
                }
                if (!chatOpen && (e.code.startsWith('Arrow') || e.code.startsWith('Key'))) {
                    keys[e.code] = true;
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', e => { keys[e.code] = false; });
            sendBtn.addEventListener('click', handleSend);
            playerInput.addEventListener('keypress', e => { if (e.key === 'Enter') handleSend(); });

            interactBtn.addEventListener('click', tryOpenChat);
            const mobileBtns = document.querySelectorAll('.ctrl-btn');
            mobileBtns.forEach(btn => {
                btn.addEventListener('touchstart', e => {
                    e.preventDefault();
                    const key = btn.dataset.key;
                    if (key) mobileKeys[key] = true;
                });
                btn.addEventListener('touchend', e => {
                    e.preventDefault();
                    const key = btn.dataset.key;
                    if (key) mobileKeys[key] = false;
                });
                btn.addEventListener('mousedown', e => {
                    e.preventDefault();
                    const key = btn.dataset.key;
                    if (key) mobileKeys[key] = true;
                });
                btn.addEventListener('mouseup', e => {
                    e.preventDefault();
                    const key = btn.dataset.key;
                    if (key) mobileKeys[key] = false;
                });
            });

            document.querySelectorAll('.ctrl-btn, .interact-btn').forEach(btn => {
                btn.addEventListener('contextmenu', e => e.preventDefault());
            });

            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
